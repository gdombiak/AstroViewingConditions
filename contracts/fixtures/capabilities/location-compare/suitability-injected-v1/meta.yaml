notes: >
  Same candidates and input order as default-unchecked-v1. Overlay is keyed
  by candidate key, not array index: water=suitable, maybe=unknown,
  land=unsuitable; pending is omitted and stays unchecked. Ranking becomes
  water, maybe, pending, land — the reverse of default key order for the
  two extremes.
