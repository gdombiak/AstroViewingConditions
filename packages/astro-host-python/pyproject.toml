[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "astro-host"
version = "0.1.2"
description = "Python host orchestration for Astro Engine"
requires-python = ">=3.11"
dependencies = ["astro-engine>=1.1,<2.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
astro-host = "astro_host.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../astro-engine-python/src"]
