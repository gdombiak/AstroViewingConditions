name: Python Engine

on:
  push:
    branches:
      - main
      - feature/astro-engine-cli
    paths:
      - "packages/astro-engine-python/**"
      - "contracts/**"
      - "Tests/parity/**"
      - "apps/cli/**"
      - "Tools/LightPollution/fixtures/**"
      - ".github/workflows/python.yml"
  pull_request:
    branches:
      - main
    paths:
      - "packages/astro-engine-python/**"
      - "contracts/**"
      - "Tests/parity/**"
      - "apps/cli/**"
      - "Tools/LightPollution/fixtures/**"
      - ".github/workflows/python.yml"
  workflow_dispatch:

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/astro-engine-python
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install package
        run: python -m pip install -e ".[dev]"

      - name: Test
        env:
          CONTRACTS_ROOT: ${{ github.workspace }}/contracts
          NO_NETWORK: "1"
        run: python -m pytest
