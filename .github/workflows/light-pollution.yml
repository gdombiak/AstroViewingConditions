name: Light Pollution

# Harness pytest (macOS + Homebrew GDAL). Inputs:
#   - tools/light-pollution/** except its top-level markdown docs, which no
#     test reads.
#   - packages/astro-engine-python/src/**: light_pollution/binary_format.py
#     imports astro_engine.light_pollution, and astro_engine/__init__.py
#     imports most of the engine, so any engine source file can break the
#     import. The harness does not read contracts/; the byte identity of the
#     lpatlas1 fixture copies is asserted by the engine tests (python.yml,
#     swift-engine.yml), which trigger on contracts/**.
on:
  push:
    branches:
      - main
      - feature/astro-engine-cli
    paths:
      - "tools/light-pollution/**"
      - "!tools/light-pollution/*.md"
      - "packages/astro-engine-python/src/**"
      - ".github/workflows/light-pollution.yml"
  pull_request:
    branches:
      - main
    paths:
      - "tools/light-pollution/**"
      - "!tools/light-pollution/*.md"
      - "packages/astro-engine-python/src/**"
      - ".github/workflows/light-pollution.yml"
  workflow_dispatch:

jobs:
  test:
    name: harness pytest
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Homebrew GDAL
        run: brew install gdal

      - name: Create venv with Homebrew Python
        working-directory: tools/light-pollution
        run: |
          set -euo pipefail
          brew_python="$(brew --prefix)/bin/python3"
          "$brew_python" -m venv --system-site-packages .venv
          .venv/bin/python -m pip install -r requirements.txt
          .venv/bin/python -c "from osgeo import gdal; print('osgeo', gdal.__version__)"

      - name: Test harness
        working-directory: tools/light-pollution
        run: .venv/bin/python -m pytest
