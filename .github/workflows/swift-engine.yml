name: Swift Engine

on:
  push:
    branches:
      - main
      - feature/astro-engine-cli
    paths:
      - "packages/astro-engine-swift/**"
      - "contracts/**"
      - "scripts/bundle-engine-data"
      - "Tools/LightPollution/fixtures/**"
      - ".gitignore"
      - ".github/workflows/swift-engine.yml"
  pull_request:
    branches:
      - main
    paths:
      - "packages/astro-engine-swift/**"
      - "contracts/**"
      - "scripts/bundle-engine-data"
      - "Tools/LightPollution/fixtures/**"
      - ".gitignore"
      - ".github/workflows/swift-engine.yml"
  workflow_dispatch:

jobs:
  test:
    name: swift test
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Test Swift package
        env:
          CONTRACTS_ROOT: ${{ github.workspace }}/contracts
        run: swift test --package-path packages/astro-engine-swift
