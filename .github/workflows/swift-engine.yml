name: Swift Engine

# `swift test` for the engine package. Beyond the package and contracts/**,
# the tests execute scripts/bundle-engine-data, assert byte identity with
# tools/light-pollution/fixtures, and run `git check-ignore` on the generated
# resource copies, so .gitignore is a genuine input.
on:
  push:
    branches:
      - main
      - feature/astro-engine-cli
    paths:
      - "packages/astro-engine-swift/**"
      - "contracts/**"
      - "scripts/bundle-engine-data"
      - "tools/light-pollution/fixtures/**"
      - ".gitignore"
      - ".github/workflows/swift-engine.yml"
  pull_request:
    branches:
      - main
    paths:
      - "packages/astro-engine-swift/**"
      - "contracts/**"
      - "scripts/bundle-engine-data"
      - "tools/light-pollution/fixtures/**"
      - ".gitignore"
      - ".github/workflows/swift-engine.yml"
  workflow_dispatch:

jobs:
  test:
    name: swift test
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Test Swift package
        env:
          CONTRACTS_ROOT: ${{ github.workspace }}/contracts
        run: swift test --package-path packages/astro-engine-swift
