name: iOS Tests

# Full iOS XCTest (macOS). Path-filtered to the inputs of `xcodegen generate`
# + `xcodebuild test` in apps/ios (see apps/ios/project.yml):
#   - apps/ios/**: app, widget, watch sources, resources, tests, project spec.
#   - packages/astro-engine-swift/**: local SwiftPM dependency. The whole
#     package is listed (not just Sources/AstroEngine) so a manifest/target
#     change can never slip past the filter.
#   - contracts/data/** + scripts/bundle-engine-data: the pre-build phase
#     copies calibration and catalog JSON into every product bundle. The
#     whole data tree is listed rather than the exact bundled files so newly
#     bundled files are covered without editing this list.
#   - contracts/ENGINE_VERSION: bundle-engine-data validates it exists.
#   - THIRD_PARTY_NOTICES.md: read by TargetImageManifestTests.
# Docs, Python packages, Tests/parity and other workflows do not affect the
# Apple products. `workflow_call` ignores `paths`, so ios-nightly.yml still
# runs the full job unconditionally as the safety net.
on:
  push:
    branches:
      - main
      - feature/astro-engine-cli
    paths:
      - "apps/ios/**"
      - "packages/astro-engine-swift/**"
      - "contracts/data/**"
      - "contracts/ENGINE_VERSION"
      - "scripts/bundle-engine-data"
      - "THIRD_PARTY_NOTICES.md"
      - ".github/workflows/ios-tests.yml"
  pull_request:
    branches:
      - main
    paths:
      - "apps/ios/**"
      - "packages/astro-engine-swift/**"
      - "contracts/data/**"
      - "contracts/ENGINE_VERSION"
      - "scripts/bundle-engine-data"
      - "THIRD_PARTY_NOTICES.md"
      - ".github/workflows/ios-tests.yml"
  workflow_call:

jobs:
  test:
    name: Run Tests
    runs-on: macos-26
    
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      
      - name: Set timezone
        run: sudo systemsetup -settimezone "America/Los_Angeles"
      
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
      
      - name: Show Xcode version
        run: xcodebuild -version

      - name: Select Test Simulator
        id: simulator
        run: |
          set -euo pipefail

          xcrun simctl list devices available

          simulator_id="$(
            ruby -rjson -ropen3 -e '
          devices_by_runtime = JSON.parse(`xcrun simctl list -j devices available`)["devices"]

          devices = devices_by_runtime.flat_map do |runtime, runtime_devices|
            next [] unless runtime.include?("iOS")

            runtime_devices.map { |device| device.merge("runtime" => runtime) }
          end

          preferred_devices = [
            /\AiPhone 17 Pro\z/,
            /\AiPhone 16 Pro\z/,
            /\AiPhone 17\z/,
            /\AiPhone 16\z/,
            /\AiPhone/
          ]

          selected_device = preferred_devices.lazy
            .map { |pattern| devices.find { |device| device["name"].match?(pattern) } }
            .find(&:itself)

          if selected_device
            puts selected_device["udid"]
            exit
          end

          runtimes = JSON.parse(`xcrun simctl list -j runtimes available`)["runtimes"]
            .select { |runtime| runtime["platform"] == "iOS" && runtime["isAvailable"] != false }
            .sort_by { |runtime| Gem::Version.new(runtime["version"]) }
            .reverse

          device_types = JSON.parse(`xcrun simctl list -j devicetypes`)["devicetypes"]
          preferred_types = preferred_devices
            .filter_map { |pattern| device_types.find { |type| type["name"].match?(pattern) } }

          runtimes.each do |runtime|
            preferred_types.each do |device_type|
              stdout, _stderr, status = Open3.capture3(
                "xcrun",
                "simctl",
                "create",
                "CI #{device_type["name"]}",
                device_type["identifier"],
                runtime["identifier"]
              )

              if status.success?
                puts stdout.strip
                exit
              end
            end
          end

          abort "No available iOS simulator devices or compatible iOS runtimes found"
          '
          )"

          echo "id=${simulator_id}" >> "$GITHUB_OUTPUT"
          echo "Selected simulator ${simulator_id}"
      
      - name: Install XcodeGen
        run: brew install xcodegen
      
      - name: Generate Xcode Project
        working-directory: apps/ios
        run: xcodegen generate
      
      - name: Build and Test
        working-directory: apps/ios
        run: |
          xcodebuild -project AstroViewingConditions.xcodeproj \
            -scheme AstroViewingConditions \
            -configuration Debug \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}' \
            test
      
      - name: Upload Test Results
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: test-results
          path: |
            ~/Library/Developer/Xcode/DerivedData/*/Logs/Test/*.xcresult
          retention-days: 30
